<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172743"/>
      <stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#dce7f0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b9cff"/>
      <stop offset="1" stop-color="#2f75e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020817" flood-opacity=".48"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="94" fill="none" stroke="#8aa1c3" stroke-opacity=".18" stroke-width="2"/>

  <!-- Calculator body: unmistakable silhouette at favicon scale. -->
  <g filter="url(#shadow)">
    <rect x="106" y="62" width="300" height="388" rx="42" fill="url(#body)"/>
    <rect x="132" y="91" width="248" height="92" rx="18" fill="#112039"/>
    <rect x="146" y="106" width="220" height="62" rx="11" fill="#1b3151" stroke="#5b9cff" stroke-opacity=".25" stroke-width="2"/>

    <!-- Aurikrex identity cue in the display: a compact blue mark beside the result line. -->
    <g fill="url(#blue)">
      <path d="M166 144 181 129l10 10 14-14 11 11-16 16c-5 5-12 5-17 0l-4-4-4 4c-3 3-7 3-10 0-3-3-3-6 1-8Z"/>
      <path d="m211 125 10-10 11 11-10 10-11-11Z"/>
    </g>
    <text x="254" y="148" fill="#f8fbff" font-family="monospace" font-size="25" font-weight="600" text-anchor="middle">123</text>

    <!-- Four-column keypad with a blue operator column and equals key. -->
    <g fill="#f8fbff" stroke="#cbd8e2" stroke-width="2">
      <rect x="132" y="208" width="52" height="42" rx="12"/><rect x="194" y="208" width="52" height="42" rx="12"/><rect x="256" y="208" width="52" height="42" rx="12"/><rect x="318" y="208" width="52" height="42" rx="12"/>
      <rect x="132" y="262" width="52" height="42" rx="12"/><rect x="194" y="262" width="52" height="42" rx="12"/><rect x="256" y="262" width="52" height="42" rx="12"/><rect x="318" y="262" width="52" height="42" rx="12"/>
      <rect x="132" y="316" width="52" height="42" rx="12"/><rect x="194" y="316" width="52" height="42" rx="12"/><rect x="256" y="316" width="52" height="42" rx="12"/><rect x="318" y="316" width="52" height="42" rx="12"/>
      <rect x="132" y="370" width="52" height="42" rx="12"/><rect x="194" y="370" width="52" height="42" rx="12"/><rect x="256" y="370" width="52" height="42" rx="12"/>
    </g>
    <g fill="#e9f1ff" stroke="#bdd4f5" stroke-width="2">
      <rect x="318" y="370" width="52" height="42" rx="12"/>
    </g>
    <g fill="#637582" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">
      <text x="158" y="235">AC</text><text x="220" y="235">⌫</text><text x="282" y="235">%</text><text x="344" y="235" fill="#2f75e8">÷</text>
      <text x="158" y="289">7</text><text x="220" y="289">8</text><text x="282" y="289">9</text><text x="344" y="289" fill="#2f75e8">×</text>
      <text x="158" y="343">4</text><text x="220" y="343">5</text><text x="282" y="343">6</text><text x="344" y="343" fill="#2f75e8">−</text>
      <text x="158" y="397">±</text><text x="220" y="397">0</text><text x="282" y="397">.</text>
    </g>
    <rect x="318" y="370" width="52" height="42" rx="12" fill="#2f75e8"/>
    <text x="344" y="397" fill="#fff" font-family="sans-serif" font-size="22" font-weight="800" text-anchor="middle">=</text>
  </g>
</svg>
